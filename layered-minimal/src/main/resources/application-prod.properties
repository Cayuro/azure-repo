# Perfil de PRODUCCION (Azure App Service appcentinelaprodgrupo3). Es el perfil por defecto
# de application.properties, de modo que el JAR desplegado ya arranca aqui sin depender de
# ninguna Application Setting: no definirlas fue exactamente la causa de que ni las
# transacciones llegaran a Cosmos ni los casos a Azure SQL.
#
# Toda variable de entorno sigue teniendo prioridad sobre este fichero, asi que se puede
# apagar cualquiera de las dos pilas sin volver a compilar.

# --- Transacciones y scores -> Azure Cosmos DB (contenedores "transacciones" y "scores" de
# la base centinela-db). Enciende el CosmosClient del auto-configure de Spring Cloud Azure y,
# con el, CosmosTransactionRepository / CosmosTransactionScoreRepository, que son @Primary
# sobre los repositorios en memoria. Se autentica con la identidad gestionada del App
# Service, que ya tiene el rol "Cosmos DB Built-in Data Contributor" sobre la cuenta.
spring.cloud.azure.cosmos.enabled=${INGESTA_COSMOS_ENABLED:true}

# --- Casos de fraude -> Azure SQL (dbo.cases / dbo.status de sqldb-cases-prod).
# El repositorio JPA es @Profile("!local"), asi que este perfil ya lo activa.
#
# Autenticacion por Identidad Gestionada, igual que Cosmos y Storage: sin contrasena, con
# authentication=ActiveDirectoryManagedIdentity. En ese modo el driver RECHAZA la conexion si
# se le pasa una contrasena, por eso SPRING_DATASOURCE_USERNAME/PASSWORD deben quedar sin
# definir (resuelven a cadena vacia en application.properties, que es lo que el driver
# espera). Requiere que la identidad de la app exista como usuario contenido en la base:
#   CREATE USER [appcentinelaprodgrupo3] FROM EXTERNAL PROVIDER;
#   ALTER ROLE db_datareader ADD MEMBER [appcentinelaprodgrupo3];
#   ALTER ROLE db_datawriter ADD MEMBER [appcentinelaprodgrupo3];
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://sql-centinela-prod-1785197801.database.windows.net:1433;databaseName=sqldb-cases-prod;encrypt=true;trustServerCertificate=false;authentication=ActiveDirectoryManagedIdentity;}
