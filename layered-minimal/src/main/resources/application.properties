
spring.application.name=ingesta-layered-minimal
spring.jackson.deserialization.fail-on-unknown-properties=true
# El perfil por defecto es "prod", NO "local". Antes era al reves y ese era el bug: el App
# Service no define SPRING_PROFILES_ACTIVE, asi que produccion arrancaba en perfil "local",
# elegia InMemoryFraudCaseRepository (@Profile("local")) en vez de JpaFraudCaseRepository
# (@Profile("!local")) y ningun caso de fraude llegaba nunca a Azure SQL. Con el default
# invertido, el JAR desplegado arranca ya en application-prod.properties, que es donde vive
# la configuracion real de Cosmos y de Azure SQL, sin depender de que alguien se acuerde de
# crear una Application Setting.
#
# Para desarrollo local sin Azure: -Dspring.profiles.active=local. Los tests que levantan
# contexto lo fijan con @ActiveProfiles("local"), y todo lo que no sea el perfil "prod" se
# queda con los repositorios en memoria.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# Cuenta de Azure Storage donde se guardan las evidencias (sin claves, se autentica por Identidad Gestionada / az login)
azure.storage.account-name=sttransaccionesfase1ch1
azure.storage.container-name=evidencias-financieras-privado

spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB

ingesta.ratelimit.enabled=true
ingesta.ratelimit.window-seconds=60
ingesta.ratelimit.max-requests=300
ingesta.ratelimit.path-prefix=/api/

# Cola de ingesta (Azure Storage Queue) donde se publica el evento tras persistir la transaccion
azure.storage.queue-name=cola-transacciones-ingesta

# TransactionQueuePoller: consumidor real de cola-transacciones-ingesta
ingesta.queue.poll-interval-ms=2000
ingesta.queue.max-messages=5
ingesta.queue.visibility-timeout-seconds=30

# Limite de reintentos por mensaje (basado en dequeueCount) antes de moverlo a la cola de
# descartes. Azure Storage Queues NO tiene dead-lettering nativo: sin este limite, un
# mensaje que falla siempre se reprocesa hasta agotar el TTL (7 dias) y se pierde en
# silencio al expirar.
ingesta.queue.max-retries=5

# Cola de descartes (dead-letter manual) de TransactionQueuePoller: aqui van los mensajes
# permanentemente invalidos y los que superaron ingesta.queue.max-retries.
azure.storage.poison-queue-name=cola-transacciones-ingesta-poison

# Cola donde el motor de scoring encola los casos que superan el umbral de fraude
# (pendiente de aprovisionar en Azure; el bean se crea igual, solo falla el envio si se usa antes)
azure.storage.fraud-queue-name=cola-casos-fraude

# Cola de alertas que consume la Azure Function de envio de correos (func-email-sender-centinela).
# OJO: vive en una Storage Account DISTINTA de azure.storage.account-name. Las dos cuentas tienen
# una cola llamada cola-casos-fraude; la que tiene consumidor real es esta.
# Ver docs-email-sender/03-guia-integracion-productor.md
azure.storage.fraud-alert-account=stcolafraudecentinela
azure.storage.fraud-alert-queue-name=cola-casos-fraude

# Servicio de reconocimiento documental (Azure AI Document Intelligence) que extrae
# datos estructurados (nombre, ID, fechas) de las evidencias cargadas.
# (pendiente de aprovisionar en Azure; el bean se crea igual, solo falla la extraccion si se usa antes)
azure.documentintelligence.endpoint=https://pendiente-aprovisionar.cognitiveservices.azure.com/

# Persistencia de transacciones/scores en Azure Cosmos DB (CosmosTransactionRepository /
# CosmosTransactionScoreRepository). Sin claves: se autentica por Identidad Gestionada /
# az login (DefaultAzureCredential). En application.properties se mantiene false por defecto
# para que los tests y ejecuciones locales funcionen en memoria sin requerir credenciales de Azure SQL/Cosmos.
# En produccion (App Service), application-prod.properties lo activa con true.
spring.cloud.azure.cosmos.enabled=${INGESTA_COSMOS_ENABLED:false}
spring.cloud.azure.cosmos.endpoint=https://cosmos-centinela-prod.documents.azure.com:443/
spring.cloud.azure.cosmos.database=centinela-db

# Motor de scoring de semana 2
ingesta.scoring.threshold=60
ingesta.scoring.velocity-window-minutes=3
ingesta.scoring.velocity-minimum-transactions=3
ingesta.scoring.velocity-points=35
ingesta.scoring.amount-multiplier=5.0
ingesta.scoring.amount-points=30
ingesta.scoring.geo-max-speed-km-h=1000.0
ingesta.scoring.geo-points=17
ingesta.scoring.merchant-points=20
ingesta.scoring.risk-merchant-categories=gambling,crypto,adult

# Persistencia JPA en Azure SQL (JpaFraudCaseRepository, tablas dbo.cases / dbo.status).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://<your-server>.database.windows.net:1433;databaseName=<your-db>;encrypt=true;trustServerCertificate=false;}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# El pool NO abre conexiones durante el arranque (initialization-fail-timeout negativo):
# las adquiere en el primer uso real. Sin esto, si SQL no responde -- por ejemplo
# cuando SPRING_DATASOURCE_URL no esta definida y queda el placeholder de arriba --
# Hikari se queda ~30s esperando el timeout TCP y el arranque total supera el
# startup probe del App Service, que mata el contenedor antes de que Tomcat escuche.
spring.datasource.hikari.initialization-fail-timeout=-1
# Mismo motivo: Hibernate abre una conexion al arrancar solo para leer metadata del
# driver. El dialecto ya esta declarado explicitamente arriba, asi que no la necesita.
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
